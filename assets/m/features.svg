<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380" role="img" aria-label="Interactive features">
  <rect width="1000" height="300" fill="#0a0a0c"/>
  <text x="24" y="60" fill="#f2f2f2" font-family="Inter, system-ui, sans-serif" font-size="18">
    <tspan x="24" dy="0">• Custom SVG cursor — replaces the native cursor on fine pointers.</tspan>
    <tspan x="24" dy="32">• Ambient music — synthesised in-browser via the Web Audio API.</tspan>
