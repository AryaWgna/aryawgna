name: Sync GitHub Telemetry SVGs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/telemetry-*.svg"
      - "assets/contributions-*.svg"
      - "README.md"
      - "README.id.md"

jobs:
  sync:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate light and dark telemetry SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: node scripts/generate-telemetry.mjs

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry-light.svg assets/telemetry-dark.svg assets/contributions-light.svg assets/contributions-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(telemetry): update GitHub metrics and contribution SVGs [skip ci]"
            git push
          fi

